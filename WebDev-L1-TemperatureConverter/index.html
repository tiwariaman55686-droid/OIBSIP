<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter | Oasis Infobyte</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="converter-card">
    <div class="card-header">
      <div class="icon-circle">🌡️</div>
      <h1>Temperature Converter</h1>
      <p>Convert seamlessly between Celsius, Fahrenheit, and Kelvin.</p>
    </div>

    <form id="tempForm" onsubmit="return false;">
      <div class="input-group">
        <label for="degrees">Enter Temperature</label>
        <input 
          type="number" 
          id="degrees" 
          step="any" 
          placeholder="e.g. 25" 
          required 
          autocomplete="off"
        />
        <span class="error-msg" id="errorMsg"></span>
      </div>

      <div class="input-group">
        <label for="unitType">Input Unit</label>
        <select id="unitType">
          <option value="celsius">Celsius (°C)</option>
          <option value="fahrenheit">Fahrenheit (°F)</option>
          <option value="kelvin">Kelvin (K)</option>
        </select>
      </div>

      <button type="button" id="convertBtn" class="btn-convert">Convert Now</button>
      <button type="button" id="resetBtn" class="btn-reset">Reset</button>
    </form>

    <!-- Results Section -->
    <div class="results-container" id="resultsContainer">
      <h2>Converted Results</h2>
      <div class="results-grid">
        <div class="result-box">
          <span class="unit-title">Celsius</span>
          <span class="unit-val" id="resCelsius">--</span>
        </div>
        <div class="result-box">
          <span class="unit-title">Fahrenheit</span>
          <span class="unit-val" id="resFahrenheit">--</span>
        </div>
        <div class="result-box">
          <span class="unit-title">Kelvin</span>
          <span class="unit-val" id="resKelvin">--</span>
        </div>
      </div>
    </div>

    <footer class="card-footer">
      <p>Crafted by <strong>Aman Kumar Tiwari</strong></p>
      <p>AICTE Oasis Infobyte SIP — Level 1 Task 3</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
